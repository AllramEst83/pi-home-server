# Traefik: the front door. Listens on port 80 and sends <app>.${DOMAIN}
# to the container whose labels ask for that name.
services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      # Only containers with the label traefik.enable=true are published.
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --entrypoints.web.address=:80
      # Every app on port 80 is home-only, even if a port is ever forwarded.
      - --entrypoints.web.http.middlewares=lan-only@docker
      - --api.dashboard=true
      - --log.level=INFO
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.lan-only.ipallowlist.sourcerange=${LAN_RANGE},127.0.0.1/32
      - traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`) || Host(`traefik.local`)
      - traefik.http.routers.dashboard.service=api@internal
      - homepage.group=Network
      - homepage.name=Traefik
      - homepage.icon=traefik.png
      - homepage.href=http://traefik.local
      - homepage.description=Which app answers to which name

networks:
  proxy:
    external: true
