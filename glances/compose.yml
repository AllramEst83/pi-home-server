# Glances: live CPU, memory, temperature, disks, processes and containers.
services:
  glances:
    image: nicolargo/glances:latest
    container_name: glances
    restart: unless-stopped
    # See the Pi's processes, not only the container's.
    pid: host
    environment:
      - GLANCES_OPT=-w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.glances.rule=Host(`glances.${DOMAIN}`) || Host(`glances.local`)
      - traefik.http.services.glances.loadbalancer.server.port=61208
      - homepage.group=Monitoring
      - homepage.name=Glances
      - homepage.icon=glances.png
      - homepage.href=http://glances.local
      - homepage.description=CPU, memory, temperature, disks
      - homepage.widget.type=glances
      - homepage.widget.url=http://glances:61208
      - homepage.widget.version=4
      - homepage.widget.metric=info

networks:
  proxy:
    external: true
