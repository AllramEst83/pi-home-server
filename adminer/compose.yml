# Adminer: manage databases in the browser at http://adminer.local.
# Log in with System "PostgreSQL", Server "postgres", user postgres and the
# password from ~/stacks/postgres/secrets.env. Keeps no data.
services:
  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
      - ADMINER_DESIGN=dracula
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.adminer.rule=Host(`adminer.${DOMAIN}`) || Host(`adminer.local`)
      - traefik.http.services.adminer.loadbalancer.server.port=8080
      - homepage.group=Data
      - homepage.name=Adminer
      - homepage.icon=adminer.png
      - homepage.href=http://adminer.local
      - homepage.description=Manage the databases

networks:
  proxy:
    external: true
