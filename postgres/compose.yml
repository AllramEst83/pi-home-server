# PostgreSQL 17: the database server for the home network.
# Connect: host postgres.local (or 192.168.0.43), port 5432, user postgres,
# password in ~/stacks/postgres/secrets.env on the Pi. Other containers use
# host "postgres".
#
# Stays on 17: a new major version (18) needs a dump and restore, so change
# the tag only on purpose.
services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      - TZ=Europe/Stockholm
      - POSTGRES_USER=postgres
    # POSTGRES_PASSWORD=... (made once on the Pi, see README)
    env_file: secrets.env
    # Not web traffic, so not through Traefik: open to the home network only
    # (never forward it on the router).
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - proxy
    labels:
      - homepage.group=Data
      - homepage.name=PostgreSQL
      - homepage.icon=postgres.png
      - homepage.description=postgres.local:5432 (user postgres)

networks:
  proxy:
    external: true
